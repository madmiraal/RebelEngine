name: 🏗️ Build Tests
on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  test:
    name: Defines
    runs-on: ubuntu-latest
    steps:
      - name: Checking...
        shell: bash
        run: |
          echo "GCC"
          gcc --version
          echo "Option: Nothing"
          gcc -dM -E - < /dev/null | egrep "SSE|AVX" | sort
          echo "Option: -msse"
          gcc -msse -dM -E - < /dev/null | egrep "SSE|AVX" | sort
          echo "Option: -msse2"
          gcc -msse2 -dM -E - < /dev/null | egrep "SSE|AVX" | sort
          echo "Option: -msse4.2"
          gcc -msse4.2 -dM -E - < /dev/null | egrep "SSE|AVX" | sort
          echo "Option: -mavx"
          gcc -mavx -dM -E - < /dev/null | egrep "SSE|AVX" | sort
          echo "Option: -mavx2"
          gcc -mavx2 -dM -E - < /dev/null | egrep "SSE|AVX" | sort
          echo "Option: -mavx512vl"
          gcc -mavx512vl -dM -E - < /dev/null | egrep "SSE|AVX" | sort
          echo "Clang"
          clang --version
          echo "Option: Nothing"
          clang -dM -E - < /dev/null | egrep "SSE|AVX" | sort
          echo "Option: -msse"
          clang -msse -dM -E - < /dev/null | egrep "SSE|AVX" | sort
          echo "Option: -msse2"
          clang -msse2 -dM -E - < /dev/null | egrep "SSE|AVX" | sort
          echo "Option: -msse4.2"
          clang -msse4.2 -dM -E - < /dev/null | egrep "SSE|AVX" | sort
          echo "Option: -mavx"
          clang -mavx -dM -E - < /dev/null | egrep "SSE|AVX" | sort
          echo "Option: -mavx2"
          clang -mavx2 -dM -E - < /dev/null | egrep "SSE|AVX" | sort
          echo "Option: -mavx512vl"
          clang -mavx512vl -dM -E - < /dev/null | egrep "SSE|AVX" | sort
